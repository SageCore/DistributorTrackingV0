name: Build and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set image names
        run: |
          REPO_LOWER="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "BACKEND_IMAGE=${REPO_LOWER}-backend" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=${REPO_LOWER}-frontend" >> "$GITHUB_ENV"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: web/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Lightsail
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.LIGHTSAIL_SSH_KEY }}" > ~/.ssh/lightsail
          chmod 600 ~/.ssh/lightsail
          ssh-keyscan -H "${{ secrets.LIGHTSAIL_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy production Compose file
        run: |
          scp \
            -i ~/.ssh/lightsail \
            docker-compose.prod.yml \
            ${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }}:/opt/distributor-tracker/docker-compose.prod.yml

      - name: Deploy new images
        run: |
          ssh \
            -i ~/.ssh/lightsail \
            ${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }} \
            "
              set -e

              cd /opt/distributor-tracker

              # Update IMAGE_TAG in .env if present
              if grep -q '^IMAGE_TAG=' .env; then
                sed -i 's/^IMAGE_TAG=.*/IMAGE_TAG=${{ github.sha }}/' .env
              else
                echo 'IMAGE_TAG=${{ github.sha }}' >> .env
              fi

              docker compose \
                -f docker-compose.prod.yml \
                pull

              docker compose \
                -f docker-compose.prod.yml \
                run --rm backend \
                alembic upgrade head

              docker compose \
                -f docker-compose.prod.yml \
                up -d

              docker compose \
                -f docker-compose.prod.yml \
                ps

              docker image prune -f
            "