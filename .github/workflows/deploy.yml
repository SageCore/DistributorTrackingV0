name: Build and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set image name
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "IMAGE_NAME=$IMAGE_NAME" >> "$GITHUB_ENV"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


  deploy:
    name: Deploy to Lightsail
    needs: build
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.LIGHTSAIL_SSH_KEY }}" \
            > ~/.ssh/lightsail

          chmod 600 ~/.ssh/lightsail

          ssh-keyscan -H \
            "${{ secrets.LIGHTSAIL_HOST }}" \
            >> ~/.ssh/known_hosts

      - name: Copy production Compose file
        run: |
          scp \
            -i ~/.ssh/lightsail \
            docker-compose.prod.yml \
            ${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }}:/opt/distributor-tracker/docker-compose.prod.yml

      - name: Deploy new image
        run: |
          ssh \
            -i ~/.ssh/lightsail \
            ${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }} \
            "
              set -e

              cd /opt/distributor-tracker

              sed -i \
                's/^IMAGE_TAG=.*/IMAGE_TAG=${{ github.sha }}/' \
                .env

              docker compose \
                -f docker-compose.prod.yml \
                pull

              docker compose \
                -f docker-compose.prod.yml \
                run --rm api \
                alembic upgrade head

              docker compose \
                -f docker-compose.prod.yml \
                up -d

              docker compose \
                -f docker-compose.prod.yml \
                ps

              docker image prune -f
            "